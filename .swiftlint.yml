# swiftlint — https://github.com/realm/SwiftLint
included:
  - App
  - Packages/VizionCore/Sources
  - Packages/VizionCore/Tests
excluded:
  - .build
  - DerivedData
disabled_rules:
  - trailing_comma
  - todo
opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - first_where
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
line_length:
  warning: 110
  error: 140
  ignores_comments: true
  ignores_urls: true
identifier_name:
  min_length: 1
  excluded: [id, x, y, i, j, n, m, a, b, rx, ry, cx, cy, dx, dy]
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 700
  error: 1000
function_body_length:
  warning: 80
  error: 140
cyclomatic_complexity:
  warning: 20
  error: 30
nesting:
  type_level: 3
