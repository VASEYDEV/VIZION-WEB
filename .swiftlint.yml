# swiftlint — https://github.com/realm/SwiftLint
included:
  - App
  - Packages/VizionCore/Sources
  - Packages/VizionCore/Tests
excluded:
  - .build
  - DerivedData
disabled_rules:
  - trailing_comma
  - todo
  # Cursor/geometry helpers return small labeled tuples deliberately.
  - large_tuple
opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - first_where
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
line_length:
  warning: 110
  error: 140
  ignores_comments: true
  ignores_urls: true
  # Multi-line literals are user-facing copy, not code.
  ignores_multiline_strings: true
identifier_name:
  min_length: 1
  # Codable rows keep the Postgres column names (snake_case) so the wire
  # shape is visible at the declaration and never re-mapped by hand.
  allowed_symbols: ["_"]
  excluded: [id, x, y, i, j, n, m, a, b, rx, ry, cx, cy, dx, dy, hh]
type_name:
  min_length: 2
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 700
  error: 1000
function_body_length:
  warning: 80
  error: 140
cyclomatic_complexity:
  warning: 20
  error: 30
nesting:
  type_level: 3
