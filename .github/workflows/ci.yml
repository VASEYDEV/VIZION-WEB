name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: VizionCore · swift test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build + test the platform-agnostic core
        run: swift test --package-path Packages/VizionCore --parallel

  app:
    name: VIZION · xcodebuild (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Tools
        run: brew install xcodegen xcbeautify
      - name: Config (placeholder values — the build needs the keys to exist, not to be real)
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VIZION.xcodeproj -scheme VIZION
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project VIZION.xcodeproj -scheme VIZION \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify
      - name: Unit tests
        run: |
          set -o pipefail
          SIM="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z]+( [0-9A-Za-z]+)*' | head -1)"
          xcodebuild -project VIZION.xcodeproj -scheme VIZION \
            -destination "platform=iOS Simulator,name=${SIM:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify

  lint:
    name: swiftlint · swiftformat --lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint swiftformat
      - run: swiftlint --strict
      - run: swiftformat --lint .
